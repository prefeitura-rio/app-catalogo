services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
