version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - gosec
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam

  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false

    govet:
      enable:
        - atomic
        - bools
        - buildtag
        - errorsas
        - nilfunc
        - printf

    gosec:
      excludes:
        - G101
        - G104
        - G204
        - G304
        - G306
        - G404
        - G501
        - G505

  exclusions:
    rules:
      # Testes podem ter erros não verificados / falsos positivos de gosec
      - path: _test\.go$
        linters:
          - errcheck
          - gosec
      # Vocabulário PT-BR legítimo no domínio do projeto
      - path: .*
        text: "(?i)exclusivas|autor|correspondente|presentes|programas|posicional"
        linters: [misspell]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/prefeitura-rio/app-catalogo

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
