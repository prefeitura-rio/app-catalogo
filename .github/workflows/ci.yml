name: CI

on:
  pull_request:
    branches: [main]

# Cancela runs anteriores do mesmo PR/branch automaticamente
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m


  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Trivy (Vulnerability Scanning)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # Default source mode only reports vulns reachable from the module's code.
  # Text output makes the job fail when any are found.
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
          output-format: text

  docker-scan:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: [build, lint, security-scan, govulncheck, test]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (dry run)
        run: |
          VERSION=$(git rev-parse --short HEAD)
          docker buildx build \
            --platform linux/amd64 \
            --build-arg VERSION=$VERSION \
            --tag ghcr.io/${{ github.repository_owner }}/app-catalogo:pr-${{ github.event.pull_request.number }} \
            --load \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/app-catalogo:pr-${{ github.event.pull_request.number }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: catalogo
          POSTGRES_PASSWORD: catalogo
          POSTGRES_DB: catalogo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: catalogo
      DB_PASSWORD: catalogo
      DB_NAME: catalogo_test
      DB_SSL_MODE: disable
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CPF_HASH_SALT: test-cpf-hmac-key-with-at-least-32-bytes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run migrations
        run: go run cmd/migrate/main.go up

      - name: Test
        run: go test ./... -v -race -coverprofile=coverage.out -timeout 2m

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      # Falha se algum pacote de internal/ ficar sem teste ou se a cobertura
      # total cair abaixo do baseline da branch base (.github/coverage-baseline).
      - name: Coverage gate
        env:
          BASE_REF: ${{ github.base_ref }}
          COVERAGE_BASELINE_REF: origin/${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          ./scripts/coverage-gate.sh coverage.out
