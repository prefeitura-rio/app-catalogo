name: Release

on:
  release:
    types: [published]

jobs:
  build-and-deploy:
    name: Build & Push :stable
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Extract release metadata
        run: |
          VERSION=${{ github.ref_name }}
          VERSION_NO_V=${VERSION#v}
          COMMIT_HASH=$(git rev-parse HEAD)
          SHORT_HASH=$(git rev-parse --short HEAD)
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/app-catalogo"

          echo "VERSION=$VERSION"           >> $GITHUB_ENV
          echo "VERSION_NO_V=$VERSION_NO_V" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH"   >> $GITHUB_ENV
          echo "SHORT_HASH=$SHORT_HASH"     >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME"     >> $GITHUB_ENV
          echo "RELEASE_URL=https://github.com/${{ github.repository }}/releases/tag/$VERSION" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_NO_V }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get image digest
        run: |
          DIGEST=$(docker buildx imagetools inspect $IMAGE_NAME:$VERSION \
            --format '{{.Manifest.Digest}}' | grep -oE 'sha256:[a-f0-9]+' | head -n1)
          if [ -z "$DIGEST" ]; then
            echo "❌ Não foi possível obter o digest de $IMAGE_NAME:$VERSION"
            exit 1
          fi
          echo "DIGEST=$DIGEST" >> $GITHUB_ENV
          echo "Image digest: $DIGEST"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configure kubectl for GKE (Production)
        run: gcloud container clusters get-credentials --dns-endpoint application --zone=us-central1 --project="${{ vars.GCP_PROJECT_ID }}"

      - name: Update ArgoCD Application image override
        run: |
          echo "Updating production ArgoCD Application image override..."
          echo "Image: $IMAGE_NAME:stable@$DIGEST"

          # Guarda o startedAt da operação anterior: um operationState antigo (ex.: Failed)
          # não deve ser confundido com o sync que este patch vai disparar.
          PREV_OP_STARTED=$(kubectl get application catalogo -n argocd \
            -o jsonpath='{.status.operationState.startedAt}' 2>/dev/null || echo "")
          echo "PREV_OP_STARTED=$PREV_OP_STARTED" >> $GITHUB_ENV

          # Usa a tag stable: é a que o argocd-image-updater acompanha (estratégia digest),
          # evitando que ele reverta o override no próximo ciclo.
          kubectl patch application catalogo -n argocd --type=merge \
            -p="{\"spec\":{\"source\":{\"kustomize\":{\"images\":[\"$IMAGE_NAME:stable@$DIGEST\"]}}}}"

          # Força sync imediato (sem isso, ArgoCD pode ficar em Synced sem re-aplicar)
          kubectl annotate application catalogo -n argocd \
            argocd.argoproj.io/refresh=hard --overwrite

          echo "✅ ArgoCD Application updated and refresh triggered"

      - name: Wait for ArgoCD sync and rollout to start
        timeout-minutes: 15
        run: |
          echo "Waiting for ArgoCD to sync (PreSync Job catalogo-migrate runs first)..."
          echo "Expected digest: $DIGEST"

          while true; do
            CURRENT_IMAGE=$(kubectl get rollout catalogo -n catalogo \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
            SYNC_STATUS=$(kubectl get application catalogo -n argocd \
              -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "")
            OP_PHASE=$(kubectl get application catalogo -n argocd \
              -o jsonpath='{.status.operationState.phase}' 2>/dev/null || echo "")

            OP_STARTED=$(kubectl get application catalogo -n argocd \
              -o jsonpath='{.status.operationState.startedAt}' 2>/dev/null || echo "")

            echo "Image=$CURRENT_IMAGE, ArgoCD Sync=$SYNC_STATUS, Operation=$OP_PHASE, OpStarted=$OP_STARTED"

            if [[ "$CURRENT_IMAGE" == *"$DIGEST"* ]]; then
              echo "✅ Rollout spec updated with correct image digest!"
              break
            fi

            # Só é falha se for uma operação nova (startedAt diferente do capturado antes do patch)
            if [ -n "$OP_STARTED" ] && [ "$OP_STARTED" != "$PREV_OP_STARTED" ] && \
               { [ "$OP_PHASE" = "Failed" ] || [ "$OP_PHASE" = "Error" ]; }; then
              echo "❌ ArgoCD operation $OP_PHASE"
              kubectl get application catalogo -n argocd \
                -o jsonpath='{.status.operationState.message}'
              echo
              echo "Logs do job catalogo-migrate:"
              kubectl logs job/catalogo-migrate -n catalogo --tail=200 || true
              exit 1
            fi

            sleep 10
          done

      - name: Monitor Rollout
        timeout-minutes: 45
        run: |
          echo "Monitoring rollout progress for version $VERSION..."
          echo "Expected image: $IMAGE_NAME:stable@$DIGEST"

          while true; do
            PHASE=$(kubectl get rollout catalogo -n catalogo -o jsonpath='{.status.phase}')
            MESSAGE=$(kubectl get rollout catalogo -n catalogo -o jsonpath='{.status.message}')
            CURRENT_IMAGE=$(kubectl get rollout catalogo -n catalogo -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "Rollout phase: $PHASE"
            echo "Message: $MESSAGE"
            echo "Current image: $CURRENT_IMAGE"

            if [[ "$CURRENT_IMAGE" != *"$DIGEST"* ]]; then
              echo "⚠️ WARNING: Rollout image changed unexpectedly!"
              echo "Expected digest: $DIGEST"
              echo "Got: $CURRENT_IMAGE"
            fi

            if [ "$PHASE" = "Healthy" ]; then
              WORKER_IMAGE=$(kubectl get deploy catalogo-worker -n catalogo \
                -o jsonpath='{.spec.template.spec.containers[0].image}')
              if [[ "$WORKER_IMAGE" != *"$DIGEST"* ]]; then
                echo "❌ Worker não está na imagem esperada: $WORKER_IMAGE"
                exit 1
              fi
              kubectl rollout status deploy/catalogo-worker -n catalogo --timeout=5m
              echo "✅ Rollout completed successfully!"
              exit 0
            fi

            if [ "$PHASE" = "Degraded" ] || [ "$PHASE" = "Aborted" ]; then
              echo "❌ Rollout failed - status is $PHASE"
              echo "Message: $MESSAGE"
              kubectl get analysisrun -n catalogo --sort-by=.metadata.creationTimestamp | tail -5 || true
              exit 1
            fi

            kubectl get rollout catalogo -n catalogo

            echo "Waiting 30s before next check..."
            sleep 30
          done

      - name: Create deployment summary
        if: always()
        run: |
          echo "## 🚀 Release — app-catalogo" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`$SHORT_HASH\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags**: \`:stable\`, \`:$VERSION\`, \`:$VERSION_NO_V\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest**: \`${DIGEST:-n/a}\`" >> $GITHUB_STEP_SUMMARY
          PHASE=$(kubectl get rollout catalogo -n catalogo -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
          echo "**Rollout**: $PHASE" >> $GITHUB_STEP_SUMMARY

      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook não configurado, pulando"
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Succeeded"
            COLOR="3066993"
          else
            STATUS_EMOJI="❌"
            STATUS_TEXT="Failed"
            COLOR="15158332"
          fi

          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/$COMMIT_HASH"

          DISCORD_PAYLOAD=$(cat <<EOF
          {
            "content": "<@&903644455582695494>",
            "embeds": [{
              "title": "${STATUS_EMOJI} Production Release ${STATUS_TEXT} — app-catalogo",
              "description": "Imagem :stable publicada no GHCR.",
              "color": ${COLOR},
              "fields": [
                {"name":"🏷️ Version","value":"[$VERSION]($RELEASE_URL)","inline":true},
                {"name":"📝 Commit","value":"[${COMMIT_MSG:0:60}]($COMMIT_URL)","inline":false},
                {"name":"👤 Author","value":"${COMMIT_AUTHOR}","inline":true},
                {"name":"🔖 Hash","value":"\`${SHORT_HASH}\`","inline":true}
              ],
              "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
              "footer": {"text": "GitHub Actions · app-catalogo"}
            }]
          }
          EOF
          )

          curl -s -H "Content-Type: application/json" -d "$DISCORD_PAYLOAD" "${DISCORD_WEBHOOK}?thread_id=1465648387566338140"
